name: TypeScript Interpreter CI

on:
  push:
    paths:
      - "typescript-interpreter/**"
      - ".github/workflows/typescript-interpreter.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "typescript-interpreter/**"
      - ".github/workflows/typescript-interpreter.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-interpreter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: typescript-interpreter/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript-interpreter/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --audit-level=high --ignore-registry-errors

  docker:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: typescript-interpreter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image and run the checks in it
        uses: docker/build-push-action@v5
        with:
          context: typescript-interpreter
          target: check
          push: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AFM TypeScript Interpreter
            org.opencontainers.image.licenses=Apache-2.0
